name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lupa
        run: pip install lupa

      - name: Run unit tests
        run: python ChattyLittleNpc/tests/run_tests.py
