package-as: ChattyLittleNpc

# The repo holds three addon folders side by side. The packager copies the
# repo into ChattyLittleNpc/, so move each one up to the top of the zip.
move-folders:
  ChattyLittleNpc/ChattyLittleNpc: ChattyLittleNpc
  ChattyLittleNpc/ChattyLittleNpc_Collector: ChattyLittleNpc_Collector
  ChattyLittleNpc/ChattyLittleNpc_Tools: ChattyLittleNpc_Tools
ignore:
  - deploy.py
  - release.py
  - README.md
  - CURSEFORGE.md
  - docs
  - .vscode
  - .github
  - .venv
  - __pycache__
  - ChattyLittleNpc/tests
  - ChattyLittleNpc/docs
  - ChattyLittleNpc/types.lua
